# Starts a local MySQL 8 database for development.
# Run from the project root:   docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: flatmeals-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: flatmeals
      MYSQL_USER: flatmeals
      MYSQL_PASSWORD: flatmeals
      TZ: Asia/Dhaka
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql   # data survives container restarts

volumes:
  mysql-data:
